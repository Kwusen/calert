name: Release

# Convenience "tag = release" path: pushing a v* tag builds images, creates the
# GitHub Release (via GoReleaser), and publishes a Helm chart release. For crafted
# releases use the app-release.yml dispatch instead. Suppress with [skip release]
# in the tagged commit message.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve Go version
        id: gover
        run: |
          set -euo pipefail
          gover="$(grep -E '^toolchain[[:space:]]' go.mod | sed -E 's/^toolchain[[:space:]]+go//' || true)"
          [ -z "${gover}" ] && gover="$(grep -E '^go[[:space:]]' go.mod | awk '{print $2}')"
          echo "gover=${gover}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVER: ${{ steps.gover.outputs.gover }}
          # Empty REBUILD => release.disable evaluates false => GitHub Release is created.
          REBUILD: ""

  chart:
    needs: goreleaser
    uses: ./.github/workflows/_publish-chart.yml
    with:
      app_version: ${{ github.ref_name }}
      chart_version: ""
      ref: ${{ github.ref_name }}
    permissions:
      contents: write
    secrets: inherit
