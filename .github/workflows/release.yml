name: Release

# Convenience "tag = release" path: pushing a v* tag builds images, creates the
# GitHub Release, and publishes a Helm chart release (all via the reusable
# _release.yml). For crafted releases use app-release.yml instead. Suppress with
# [skip release] in the tagged commit message.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    uses: ./.github/workflows/_release.yml
    with:
      ref: ${{ github.ref_name }}
      app_version: ${{ github.ref_name }}
      publish_chart: true
      create_github_release: true
    secrets: inherit
