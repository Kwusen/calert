name: Refresh (Go / deps)

# Automated refresh of the current release line. Fires when Go (toolchain) or a
# dependency changes on main (go.mod / go.sum). Rebuilds main and republishes
# container images + a Helm release. No app-version bump, no GitHub Release.
# Features never leak here: they live on `next`, not on `main`.

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (default: main)."
        required: false
        default: main
      go_version:
        description: "Override Go version (default: from go.mod toolchain)."
        required: false
        default: ""
      chart_version:
        description: "Explicit chart version (default: auto patch-bump)."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  refresh:
    # Allow skipping an automatic refresh with [skip refresh] in the commit message.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip refresh]') }}
    runs-on: ubuntu-latest
    outputs:
      describe: ${{ steps.vars.outputs.describe }}
      sha: ${{ steps.vars.outputs.sha }}
      skip: ${{ steps.idem.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Resolve versions
        id: vars
        env:
          GO_OVERRIDE: ${{ github.event.inputs.go_version }}
        run: |
          set -euo pipefail
          describe="$(git describe --tags)"
          tag="$(git tag --sort=-v:refname | grep -vE '-' | head -1 || true)"
          if [ -n "${GO_OVERRIDE}" ]; then
            gover="${GO_OVERRIDE}"
          else
            gover="$(grep -E '^toolchain[[:space:]]' go.mod | sed -E 's/^toolchain[[:space:]]+go//' || true)"
            [ -z "${gover}" ] && gover="$(grep -E '^go[[:space:]]' go.mod | awk '{print $2}')"
          fi
          echo "describe=${describe}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "gover=${gover}"       >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "describe=${describe} tag=${tag} gover=${gover}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Idempotency check
        id: idem
        env:
          DESCRIBE: ${{ steps.vars.outputs.describe }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):${DESCRIBE}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            echo "Image ${image} already exists — nothing to refresh."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.idem.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.vars.outputs.gover }}
          cache: true

      - name: Run GoReleaser (rebuild, no release)
        if: steps.idem.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.vars.outputs.describe }}
          GOVER: ${{ steps.vars.outputs.gover }}
          REBUILD: "1"

  publish-chart:
    needs: refresh
    if: ${{ needs.refresh.outputs.skip != 'true' }}
    uses: ./.github/workflows/_publish-chart.yml
    with:
      app_version: ${{ needs.refresh.outputs.describe }}
      chart_version: ${{ github.event.inputs.chart_version || '' }}
      ref: ${{ needs.refresh.outputs.sha }}
    permissions:
      contents: write
    secrets: inherit
