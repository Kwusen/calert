name: App release (manual)

# Deliberate, parameterized app release. Builds container images and (optionally)
# publishes a Helm release with crafted parameters. Does NOT create git tags or a
# GitHub Release itself — the maintainer merges next -> main, tags, and drafts the
# release; this workflow just produces the artifacts.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch/tag/sha, default main)."
        required: false
        default: main
      app_version:
        description: "App version for the image/chart (e.g. v2.4.0)."
        required: true
      build_images:
        description: "Build & push container images."
        type: boolean
        default: true
      publish_chart:
        description: "Publish a Helm chart release."
        type: boolean
        default: true
      chart_version:
        description: "Explicit chart version (default: auto patch-bump above published max)."
        required: false
        default: ""
      go_version:
        description: "Override Go version (default: from go.mod toolchain)."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  images:
    if: ${{ inputs.build_images }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve Go version
        id: vars
        env:
          GO_OVERRIDE: ${{ inputs.go_version }}
        run: |
          set -euo pipefail
          if [ -n "${GO_OVERRIDE}" ]; then
            gover="${GO_OVERRIDE}"
          else
            gover="$(grep -E '^toolchain[[:space:]]' go.mod | sed -E 's/^toolchain[[:space:]]+go//' || true)"
            [ -z "${gover}" ] && gover="$(grep -E '^go[[:space:]]' go.mod | awk '{print $2}')"
          fi
          echo "gover=${gover}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.vars.outputs.gover }}
          cache: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (images only)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.app_version }}
          GOVER: ${{ steps.vars.outputs.gover }}
          # REBUILD disables the GitHub Release; the maintainer drafts it deliberately.
          REBUILD: "1"

  chart:
    needs: images
    # Run when publish_chart is requested, even if `images` was skipped
    # (build_images=false), but not if the image build actually failed.
    if: ${{ always() && inputs.publish_chart && needs.images.result != 'failure' && needs.images.result != 'cancelled' }}
    uses: ./.github/workflows/_publish-chart.yml
    with:
      app_version: ${{ inputs.app_version }}
      chart_version: ${{ inputs.chart_version }}
      ref: ${{ inputs.ref }}
    permissions:
      contents: write
    secrets: inherit
